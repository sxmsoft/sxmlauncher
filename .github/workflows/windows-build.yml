name: Windows build

# Linux desktop QA passed. workflow_dispatch still requires the exact
# LINUX-QA-PASSED gate. The Cursor GitHub App cannot send that dispatch
# (actions:write is denied), so these branches also build on push.
on:
  workflow_dispatch:
    inputs:
      linux_qa:
        description: "Type LINUX-QA-PASSED to allow a Windows build"
        required: true
  push:
    branches:
      - cursor/nebula-vault-ui-3cab
      - cursor/misty-visual-redesign-f4d5

jobs:
  build-windows:
    if: github.event.inputs.linux_qa == 'LINUX-QA-PASSED' || github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for CI unsigned build
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.bundle) j.bundle.createUpdaterArtifacts=false; if(j.plugins&&j.plugins.updater) j.plugins.updater.active=false; fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - name: Build Tauri app
        run: pnpm build:app

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Get-ChildItem src-tauri/target/release -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(sxmlauncher|SXMLauncher)\.exe$' } |
            ForEach-Object { Copy-Item $_.FullName dist-artifacts/SXMLAUNCHER.exe -Force }
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*setup.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist-artifacts/ -Force }
          Get-ChildItem dist-artifacts | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SXMLauncher-windows
          path: dist-artifacts/*
          if-no-files-found: error
