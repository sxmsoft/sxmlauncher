name: Build

# CI build for pull requests and the main line.
#   linux   : typecheck, unit tests (frontend + Rust), unsigned .deb/.AppImage
#   windows : unsigned NSIS/MSI + portable exe
# Signed, published releases live in release.yml (manual, uses repository
# secrets). This workflow needs NO secrets: updater artifacts are disabled.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri 2 / WebKitGTK 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Frontend typecheck + tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Rust unit tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Disable updater artifacts for unsigned CI build
        run: node scripts/ci-disable-updater.mjs

      - name: Build Tauri app (deb + AppImage)
        run: pnpm tauri build --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SXMLAUNCHER-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Disable updater artifacts for unsigned CI build
        run: node scripts/ci-disable-updater.mjs

      - name: Build Tauri app (NSIS + MSI)
        run: pnpm build:app

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts | Out-Null
          Get-ChildItem src-tauri/target/release -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^(sxmlauncher|SXMLauncher)\.exe$' } |
            ForEach-Object { Copy-Item $_.FullName dist-artifacts/SXMLAUNCHER.exe -Force }
          Get-ChildItem src-tauri/target/release/bundle -Recurse -Include *.msi,*setup.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName dist-artifacts/ -Force }
          Get-ChildItem dist-artifacts | Format-Table Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SXMLAUNCHER-windows
          path: dist-artifacts/*
          if-no-files-found: error
